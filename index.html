<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>Subway Surfers - Colombo Sri Lanka Edition (Camera Motion Tracking)</title>
  <meta name="description" content="Subway Surfers Colombo Sri Lanka Edition with AI webcam motion tracking and fill-in-the-blanks Word Hunt.">
  <link rel="icon" href="./NewYorkIcon.png">
  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Real Subway Surfers Fullscreen Game Holder */
    #og-game-holder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b1a2d;
      background-image: url('assets/preload/colombo_map.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 1;
    }

    /* Keep HUD & Camera PIP floating on top of official 3D canvas */
    #game-hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 24px;
    }

    .quick-controls, .word-hunt-container, .camera-pip-widget {
      pointer-events: auto !important;
    }
  </style>

  <!-- Google MediaPipe Face Detection AI for Zero-Lag Motion Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

  <!-- Three.js 3D Engine for Colombo City Runner -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- The Real Subway Surfers 3D WebGL Game Canvas Holder -->
  <div id="og-game-holder"></div>

  <!-- Game HUD Overlay with Word Hunt & Controls -->
  <div id="game-hud">
    <!-- Top Bar -->
    <div class="hud-top-bar">
      <!-- Quick Control Buttons -->
      <div class="quick-controls">
        <button id="btn-sound-toggle" class="icon-btn" title="Toggle Sound">🔊</button>
        <button id="btn-camera-toggle" class="icon-btn" title="Toggle Camera">📷</button>
        <button id="btn-speed-toggle" class="icon-btn" title="Toggle Game Speed" style="font-size: 13px; font-weight: 800; width: auto; padding: 0 12px; color: #ffea00;">🐢 Slow</button>
        <button id="btn-quick-calibrate" class="icon-btn" title="Calibrate Center (or press C)" style="font-size: 14px; font-weight: 800; width: auto; padding: 0 12px;">🎯 Center [C]</button>
      </div>

      <!-- Word Hunt "Fill in the Blanks" Banner -->
      <div id="word-hunt-container" class="word-hunt-container">
        <div class="word-hunt-header">
          <span class="word-hunt-title">WORD HUNT</span>
          <span class="word-hunt-badge">DAILY EVENT</span>
        </div>
        <!-- Letter Blank Slots -->
        <div id="word-hunt-slots" class="word-hunt-slots"></div>
        <div id="word-hunt-status" class="word-hunt-status">Collect letters in Colombo city!</div>
      </div>

      <!-- Live Colombo Run Stats (Score & Coins) -->
      <div class="stats-container">
        <div class="stat-pill">
          <span class="stat-icon">🏆</span>
          <span id="hud-score" class="stat-value" style="font-size: 20px; font-weight: 900; color: #ffcc00;">0</span>
        </div>
        <div style="display: flex; gap: 8px;">
          <div class="stat-pill" style="padding: 4px 12px;">
            <span class="stat-icon">🪙</span>
            <span id="hud-coins" class="stat-value" style="font-size: 15px; font-weight: 800; color: #ffd700;">0</span>
          </div>
          <div class="stat-pill" style="padding: 4px 12px;">
            <span id="hud-multiplier" class="stat-value" style="font-size: 15px; font-weight: 900; color: #00ffcc;">1X</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Camera PIP (Picture-In-Picture) Motion Tracker Widget -->
  <div id="camera-pip-widget" class="camera-pip-widget">
    <div class="pip-header">
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="pip-live-dot"></span>
        <span>AI CAM TRACKER</span>
      </div>
      <span id="pip-status-tag" style="font-size: 8px; opacity: 0.8;">ACTIVE</span>
    </div>

    <div class="pip-viewport">
      <video id="webcam-video" playsinline autoplay muted></video>
      <canvas id="webcam-canvas"></canvas>
      <div id="pip-gesture-badge" class="pip-gesture-badge">🟢 CENTER</div>
    </div>

    <div class="pip-controls">
      <button id="btn-pip-calibrate" class="pip-btn" title="Set Current Position as Center">🎯 Center (C)</button>
      <button id="btn-pip-mode" class="pip-btn" title="Switch Sensitivity">⚡ Normal</button>
    </div>
  </div>

  <!-- Game Over Modal Card -->
  <div id="game-over-menu" class="hidden" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 15, 30, 0.85); z-index: 100; backdrop-filter: blur(10px);">
    <div style="background: rgba(20, 25, 45, 0.95); border: 2px solid #ff007f; border-radius: 24px; padding: 32px 40px; text-align: center; box-shadow: 0 10px 40px rgba(255, 0, 127, 0.4); max-width: 400px; width: 90%;">
      <div style="font-size: 13px; font-weight: 800; color: #00ffcc; letter-spacing: 2px; text-transform: uppercase;">Colombo City Runner</div>
      <h1 style="font-family: var(--font-display); font-size: 36px; color: #ff007f; margin: 8px 0 16px;">GAME OVER</h1>
      <div style="background: rgba(255, 255, 255, 0.06); border-radius: 16px; padding: 16px; margin-bottom: 24px;">
        <div style="font-size: 12px; color: #aaa;">DISTANCE SCORE</div>
        <div id="final-score" style="font-size: 34px; font-weight: 900; color: #ffcc00;">0</div>
        <div style="display: flex; justify-content: space-around; margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px;">
          <div>
            <div style="font-size: 11px; color: #888;">COINS</div>
            <div id="final-coins" style="font-size: 18px; font-weight: 800; color: #ffd700;">0</div>
          </div>
          <div>
            <div style="font-size: 11px; color: #888;">HIGH SCORE</div>
            <div id="final-highscore" style="font-size: 18px; font-weight: 800; color: #00ffcc;">0</div>
          </div>
        </div>
      </div>
      <button id="btn-restart-game" style="font-family: var(--font-display); font-size: 18px; padding: 14px 28px; border-radius: 50px; background: linear-gradient(135deg, #00ffcc, #00bbff); color: #002233; border: none; cursor: pointer; box-shadow: 0 6px 20px rgba(0, 255, 204, 0.5); font-weight: 900; letter-spacing: 1px; width: 100%;">🏃 RUN AGAIN IN COLOMBO</button>
    </div>
  </div>

  <!-- Audio & Tracking Modules -->
  <script src="js/audio.js"></script>
  <script src="js/word-hunt.js"></script>
  <script src="js/camera-tracker.js"></script>

  <!-- Subway Surfers 3D Colombo City Engine -->
  <script src="js/game.js"></script>

  <script>
    // --- Master Colombo Integration Controller ---
    window.addEventListener("DOMContentLoaded", () => {
      // 1. Initialize Word Hunt
      window.wordHunt.init("word-hunt-slots", "word-hunt-status");

      // 2. Initialize and start 3D Colombo City Runner
      if (window.subwayGame) {
        window.subwayGame.init("og-game-holder");
        window.subwayGame.setGameSpeed("relaxed");
        window.subwayGame.start();
        window.subwayController = window.subwayGame;
      }

      // 3. UI Controls Setup
      const btnSoundToggle = document.getElementById("btn-sound-toggle");
      const btnCameraToggle = document.getElementById("btn-camera-toggle");
      const btnSpeedToggle = document.getElementById("btn-speed-toggle");
      const btnQuickCalibrate = document.getElementById("btn-quick-calibrate");
      const btnPipCalibrate = document.getElementById("btn-pip-calibrate");
      const btnPipMode = document.getElementById("btn-pip-mode");
      const btnRestart = document.getElementById("btn-restart-game");

      const pipWidget = document.getElementById("camera-pip-widget");
      const pipBadge = document.getElementById("pip-gesture-badge");
      const pipStatusTag = document.getElementById("pip-status-tag");

      if (btnRestart) {
        btnRestart.addEventListener("click", () => {
          if (window.subwayGame) window.subwayGame.start();
        });
      }

      // Connect AI Camera Tracker to 3D Colombo Runner
      window.cameraTracker.onLaneChange = (lane) => {
        if (window.subwayGame) {
          window.subwayGame.setLane(lane);
        }
      };

      window.cameraTracker.onJump = () => {
        if (window.subwayGame) {
          window.subwayGame.jump();
        }
      };

      window.cameraTracker.onDuck = () => {
        if (window.subwayGame) {
          window.subwayGame.slide();
        }
      };

      // Camera Tracker status update listener
      window.cameraTracker.onStatusUpdate = (status) => {
        if (pipBadge) {
          pipBadge.textContent = status.action;
          if (status.action.includes("JUMP")) {
            pipBadge.style.borderColor = "#ffea00";
            pipBadge.style.color = "#ffea00";
          } else if (status.action.includes("DUCK") || status.action.includes("SLIDE")) {
            pipBadge.style.borderColor = "#ff007f";
            pipBadge.style.color = "#ff007f";
          } else if (status.action.includes("LEFT") || status.action.includes("RIGHT")) {
            pipBadge.style.borderColor = "#00ffcc";
            pipBadge.style.color = "#00ffcc";
          } else {
            pipBadge.style.borderColor = "rgba(255,255,255,0.4)";
            pipBadge.style.color = "#ffffff";
          }
        }
      };

      // Auto-start webcam tracking
      async function startCamera() {
        if (!window.cameraTracker.isActive) {
          pipStatusTag.textContent = "AI STARTING...";
          const ok = await window.cameraTracker.init("webcam-video", "webcam-canvas");
          if (ok) {
            pipStatusTag.textContent = "AI READY";
            pipStatusTag.style.color = "#00ffcc";
          } else {
            pipStatusTag.textContent = "KEYBOARD";
            pipStatusTag.style.color = "#ffaa00";
          }
        }
      }
      startCamera();

      // Calibrate center buttons
      function triggerCalibration() {
        if (window.cameraTracker) {
          window.cameraTracker.calibrateNow();
        }
      }
      if (btnPipCalibrate) btnPipCalibrate.addEventListener("click", triggerCalibration);
      if (btnQuickCalibrate) btnQuickCalibrate.addEventListener("click", triggerCalibration);

      // Sensitivity preset cycle
      const presets = ["normal", "high", "low"];
      let sensIndex = 0;
      if (btnPipMode) {
        btnPipMode.addEventListener("click", () => {
          sensIndex = (sensIndex + 1) % presets.length;
          const current = presets[sensIndex];
          window.cameraTracker.setSensitivity(current);
          btnPipMode.textContent = `⚡ ${current.charAt(0).toUpperCase() + current.slice(1)}`;
        });
      }

      // Speed options cycle
      const speedOptions = [
        { id: "relaxed", speed: 9.5, label: "🐢 Slow" },
        { id: "normal", speed: 13.5, label: "🏃 Mid" },
        { id: "fast", speed: 18.0, label: "⚡ Fast" }
      ];
      let speedOptionIdx = 0;

      if (btnSpeedToggle) {
        btnSpeedToggle.addEventListener("click", () => {
          speedOptionIdx = (speedOptionIdx + 1) % speedOptions.length;
          const opt = speedOptions[speedOptionIdx];
          if (window.subwayGame) {
            window.subwayGame.setGameSpeed(opt.id);
          }
          btnSpeedToggle.textContent = opt.label;
        });
      }

      // Camera toggle button
      if (btnCameraToggle) {
        btnCameraToggle.addEventListener("click", () => {
          if (pipWidget.style.display === "none") {
            pipWidget.style.display = "block";
            startCamera();
          } else {
            pipWidget.style.display = "none";
          }
        });
      }

      // Sound toggle
      if (btnSoundToggle) {
        btnSoundToggle.addEventListener("click", () => {
          if (window.soundEngine) {
            const isMuted = window.soundEngine.toggleMute();
            btnSoundToggle.textContent = isMuted ? "🔇" : "🔊";
          }
        });
      }
    });
  </script>
</body>
</html>
